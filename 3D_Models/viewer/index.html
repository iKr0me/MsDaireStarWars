<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ms. Daire · The model collection</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090d1a;color:#f3eee3;font:15px system-ui,sans-serif}header{position:absolute;top:28px;left:34px;z-index:2;pointer-events:auto}small{color:#aab8d1;letter-spacing:.18em;font-size:10px;text-transform:uppercase}h1{font-weight:450;letter-spacing:-.04em;font-size:30px;margin:8px 0}header p{color:#99a6ba;font-size:13px;margin:0}.stage{width:100vw;height:100vh}nav{position:absolute;z-index:3;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;border:1px solid #ffffff21;border-radius:20px;background:#101827ef;max-width:95vw;overflow-x:auto}button{white-space:nowrap;cursor:pointer;background:transparent;border:0;border-radius:13px;color:#aab8ce;padding:13px 16px;font:inherit;font-size:13px}button[aria-pressed=true]{background:#e9dfc5;color:#182237}button:focus-visible{outline:2px solid #85cffa;outline-offset:2px}.meta{position:absolute;left:34px;bottom:112px;max-width:350px;font-size:12px;line-height:1.7;color:#94a5bd}.meta strong{color:#e9dfc5;font-weight:500}#status{position:absolute;top:35px;right:34px;color:#8ea7c6;font-size:11px;letter-spacing:.04em}@media(max-width:650px){header{left:20px;top:22px}h1{font-size:24px}header p{max-width:250px;font-size:12px}#status{top:auto;bottom:172px;right:20px}.meta{left:20px;bottom:108px;max-width:260px}nav{bottom:20px;max-width:95vw}button{padding:12px}}
</style><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><header><small>A little hope from a galaxy far, far away</small><h1>The model collection</h1><p>Your selected Sketchfab models and two edited X-wings.</p></header><div class="stage" aria-label="Interactive 3D model: drag to orbit and scroll to zoom"></div><div id="status" aria-live="polite">Loading the fleet…</div><div class="meta"><strong id="label">R2’s X-wing</strong><br><span id="description">Empty cockpit · open canopy · movable R2 dome</span><br>Drag to orbit. Scroll or pinch to zoom.</div><nav aria-label="Choose a model"></nav>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from './vendor/loaders/GLTFLoader.js';
import {OrbitControls} from './vendor/controls/OrbitControls.js';
const items=[['stylized_x-_wing_open_cockpit','R2 · open cockpit','Original canopy hinged open · empty cabin · R2 retained'],['stylized_x-_wing_without_r2d2','Chase X-wing','R2 removed · original closed canopy · socket retained'],['stylized_x-_wing','Original X-wing','Unmodified source by Alexander Günther'],['millennium_falcon','Millennium Falcon','Model by GaryPhelps'],['tie_fighter_-_star_wars','TIE fighter','Model by Quiznos323'],['death_star_-_star_wars','Death Star','Model by Quiznos323'],['coruscant','Coruscant','Model by Mateusz Woliński']];
const scene=new THREE.Scene();scene.background=new THREE.Color('#090d1a');
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.05,300);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.querySelector('.stage').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xcde6ff,0x39344c,2.1));
for(const [color,power,x,y,z] of [[0xffe7ca,3,-8,12,8],[0xa7c9ff,2,10,4,-6],[0xffffff,1,0,-4,8]]){const l=new THREE.DirectionalLight(color,power);l.position.set(x,y,z);scene.add(l)}
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=.01;controls.maxDistance=10000000;controls.enablePan=false;
const dust=[];let seed=47;const random=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};for(let i=0;i<700;i++){const v=new THREE.Vector3(random()-.5,random()-.5,random()-.5).normalize().multiplyScalar(85);dust.push(v.x,v.y,v.z)}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(dust,3));scene.add(new THREE.Points(geometry,new THREE.PointsMaterial({color:0x91a3c7,size:.075,transparent:true,opacity:.55})));
const loader=new GLTFLoader(),cache=new Map();let current=null,selection=0;
async function select(i){const request=++selection;const [file,label,description]=items[i];document.querySelectorAll('nav button').forEach((b,j)=>b.setAttribute('aria-pressed',i===j));document.querySelector('#status').textContent='Loading…';try{let model=cache.get(file);if(!model){model=(await loader.loadAsync('../'+file+'.glb')).scene;cache.set(file,model)}if(request!==selection)return;if(current)scene.remove(current);current=model;scene.add(model);const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),radius=size.length()*.5;controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(.9,.65,1.2).normalize().multiplyScalar(radius/Math.sin(Math.min(THREE.MathUtils.degToRad(camera.fov),2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*camera.aspect))/2)*1.12));camera.near=Math.max(radius/10000,.00001);camera.far=Math.max(radius*100,100);controls.minDistance=radius*.03;controls.maxDistance=radius*10;camera.updateProjectionMatrix();controls.update();document.querySelector('#label').textContent=label;document.querySelector('#description').textContent=description;document.querySelector('#status').textContent='GLB · local artwork · drag to inspect';document.querySelector('header p').innerHTML='Creator credits: <a href="../CREDITS.md" style="color:inherit">CREDITS.md</a>';window.modelReady=file;window.assetScene=model;window.assetCamera=camera;window.assetControls=controls;window.assetRenderer=renderer;}catch(e){document.querySelector('#status').textContent='Could not load model. Serve this folder locally.';console.error(e)}}
items.forEach((item,i)=>{const button=document.createElement('button');button.textContent=item[1];button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>select(i));document.querySelector('nav').append(button)});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});select(0);
</script></body></html>
